<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>学习空间 v1.0 · 一站式个性化学习平台</title>
<style>
:root{--bg:#f5f7fb;--card:#ffffff;--line:#e3e8ef;--text:#1f2937;--mut:#6b7280;--acc:#4f6ef2;--acc-soft:#eef1fe;--ok:#0f9d58;--ok-soft:#e6f6ee;--bad:#e5484d;--bad-soft:#fdeeee;--gold:#d97706;--gold-soft:#fdf1dd}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI","Microsoft YaHei",sans-serif;font-size:14px;line-height:1.6}
.wrap{max-width:1120px;margin:0 auto;padding:18px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:12px}
.card-title{font-size:15px;font-weight:700;margin:0 0 10px;display:flex;align-items:center;gap:8px;justify-content:space-between;flex-wrap:wrap}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.grow{flex:1;min-width:0}
.mut{color:var(--mut);font-size:12px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:4px;border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:8px;padding:6px 12px;font-size:13px;cursor:pointer;white-space:nowrap;user-select:none;font-family:inherit}
.btn:hover{border-color:var(--acc);color:var(--acc)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn-p{background:var(--acc);border-color:var(--acc);color:#fff}.btn-p:hover{color:#fff;opacity:.9}
.btn-ok{background:var(--ok);border-color:var(--ok);color:#fff}.btn-ok:hover{color:#fff;opacity:.9}
.btn-bad{background:var(--card);border-color:var(--bad);color:var(--bad)}.btn-bad:hover{background:var(--bad);color:#fff}
.btn-sm{font-size:12px;padding:4px 9px}
.chip{display:inline-flex;align-items:center;gap:4px;border-radius:999px;padding:2px 10px;font-size:12px;font-weight:600;background:var(--acc-soft);color:var(--acc)}
.chip-gold{background:var(--gold-soft);color:var(--gold)}
.chip-ok{background:var(--ok-soft);color:var(--ok)}
.chip-bad{background:var(--bad-soft);color:var(--bad)}
input[type=text],input[type=number],textarea,select{width:100%;border:1px solid var(--line);border-radius:8px;padding:7px 10px;font-size:13px;font-family:inherit;background:#fff;color:var(--text)}
input:focus,textarea:focus,select:focus{outline:none;border-color:var(--acc)}
::placeholder{color:var(--mut);opacity:.85}
textarea{min-height:52px;resize:vertical}
.nav{display:flex;gap:6px;align-items:center;margin-bottom:12px;flex-wrap:wrap}
.nav-item{font-size:13px;padding:5px 12px;border-radius:8px;border:1px solid transparent;cursor:pointer;color:var(--mut);background:none;font-family:inherit}
.nav-item-on{background:var(--acc-soft);color:var(--acc);font-weight:700}
.tab{font-size:13px;padding:5px 14px;border-radius:8px;border:1px solid var(--line);cursor:pointer;background:var(--card);color:var(--mut);font-family:inherit}
.tab-on{background:var(--acc);border-color:var(--acc);color:#fff;font-weight:700}
.crumb{font-size:12px;color:var(--mut);margin-bottom:8px}
.crumb b{color:var(--text);cursor:pointer}
.option{display:flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:8px;padding:8px 12px;margin:6px 0;cursor:pointer;background:#fff}
.option:hover{border-color:var(--acc)}
.opt-key{flex:none;width:24px;height:24px;border-radius:50%;background:var(--acc-soft);color:var(--acc);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700}
.option-sel{border-color:var(--acc);background:var(--acc-soft)}
.option-ok{border-color:var(--ok);background:var(--ok-soft)}
.option-bad{border-color:var(--bad);background:var(--bad-soft)}
.bar{height:8px;background:var(--line);border-radius:99px;overflow:hidden}
.bar-in{height:100%;background:var(--acc);border-radius:99px}
.bar-in-ok{background:var(--ok)}
.hbar{width:100%;height:14px;background:var(--line);border-radius:99px;overflow:hidden}
.hbar-in{height:100%;background:var(--acc);border-radius:99px}
.week{display:flex;gap:6px;align-items:flex-end;height:96px;padding-top:6px}
.week-col{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;justify-content:flex-end;height:100%;min-width:0}
.week-bar{width:70%;min-height:3px;border-radius:4px 4px 0 0;background:var(--acc)}
.week-day{font-size:11px;color:var(--mut);white-space:nowrap}
.note{border-left:3px solid var(--acc);background:var(--acc-soft);padding:8px 12px;border-radius:0 8px 8px 0;font-size:13px;margin:10px 0}
.fb{border-radius:10px;padding:10px 14px;margin:10px 0;border:1px solid;font-size:13px}
.fb-ok{border-color:var(--ok);background:var(--ok-soft)}
.fb-bad{border-color:var(--bad);background:var(--bad-soft)}
.progress{display:flex;align-items:center;gap:10px;color:var(--mut);font-size:12px;margin-bottom:10px}
.tag{display:inline-block;border:1px solid var(--line);border-radius:999px;padding:3px 10px;font-size:12px;cursor:pointer;margin:3px 4px 3px 0;background:#fff;user-select:none}
.tag-on{border-color:var(--acc);background:var(--acc-soft);color:var(--acc);font-weight:600}
.empty{color:var(--mut);text-align:center;padding:26px 10px;font-size:13px}
.timer-display{text-align:center;padding:14px 0 6px}
.timer-time{font-size:46px;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:2px}
.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);background:#111827;color:#fff;padding:9px 18px;border-radius:999px;font-size:13px;box-shadow:0 8px 24px rgba(0,0,0,.25);z-index:99;max-width:90vw;text-align:center}
.label-check{display:flex;gap:6px;align-items:center;font-size:13px;margin:4px 0;cursor:pointer}
.picklist{max-height:150px;overflow:auto;border:1px solid var(--line);border-radius:8px;padding:6px 10px;margin-top:6px}
.folder{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin:6px 0;background:var(--card);cursor:pointer}
.folder:hover{border-color:var(--acc)}
.dropbar{position:sticky;top:0;z-index:9;background:var(--card);border:1px dashed var(--acc);border-radius:10px;padding:10px 12px;margin-bottom:10px;box-shadow:0 6px 18px rgba(0,0,0,.08)}
.dropchip{display:inline-block;border:1px solid var(--line);border-radius:8px;padding:4px 10px;margin:3px 4px 3px 0;cursor:pointer;background:var(--card);font-size:12px;user-select:none}
.dropchip:hover{border-color:var(--acc);color:var(--acc)}
.dropchip.over{border-color:var(--acc);background:var(--acc-soft)}
.dragging{opacity:.45}
.item{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:10px;padding:8px 12px;margin:6px 0}
.item-done{opacity:.55}
@media (prefers-color-scheme: dark){
:root{--bg:#10141c;--card:#1a212c;--line:#2a3442;--text:#e5e9f0;--mut:#8b96a5;--acc:#6d8bff;--acc-soft:#202c4d;--ok:#2ecc71;--ok-soft:#13301f;--bad:#ff6b70;--bad-soft:#3a1a1d;--gold:#f0a63e;--gold-soft:#3a2c10}
input,input[type=text],input[type=number],textarea,select,.option,.tag{background:#121826;color:var(--text)}
.toast{background:#e5e9f0;color:#111827}
}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<script>
(function () {
  'use strict';
  var KEY = 'learnhub.store.v1';
  var APP_VERSION = 'v1.0';
  var TYPE_NAMES = { single: '单选', judge: '判断', multi: '多选' };
  var MODE_LABEL = { quiz: '测验', review: '错题回顾', timer: '计时', countdown: '倒计时' };
  var ITEM_META = {
    material: { icon: '📂', label: '看资料' },
    quiz: { icon: '📝', label: '做测验' },
    review: { icon: '🔁', label: '错题回顾' },
    timer: { icon: '⏲', label: '计时学习' },
    task: { icon: '✅', label: '待办' }
  };
  var TAG_CHOICES = ['太难', '太简单', '刚好合适', '题目有误', '收获很大', '想再练一次'];

  /* ================= 工具 ================= */
  function pad2(n) { return (n < 10 ? '0' : '') + n; }
  function dateKey(d) { return d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate()); }
  function addDays(d, n) { return new Date(d.getFullYear(), d.getMonth(), d.getDate() + n); }
  function genId(p) { return p + Date.now().toString(36) + Math.floor(Math.random() * 46656).toString(36); }
  function esc(s) {
    return String(s === null || s === undefined ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  function fmtLong(sec) {
    sec = Math.max(0, Math.floor(sec || 0));
    var hh = Math.floor(sec / 3600), mm = Math.floor((sec % 3600) / 60), ss = sec % 60;
    if (hh > 0) return hh + '小时' + (mm > 0 ? mm + '分' : '');
    if (mm > 0) return mm + '分' + (ss > 0 ? ss + '秒' : '');
    return ss + '秒';
  }
  function fmtHMS(sec) {
    sec = Math.max(0, Math.floor(sec || 0));
    return pad2(Math.floor(sec / 3600)) + ':' + pad2(Math.floor((sec % 3600) / 60)) + ':' + pad2(sec % 60);
  }
  function fmtClock(t) { var d = new Date(t); return pad2(d.getHours()) + ':' + pad2(d.getMinutes()); }
  function fmtDate(t) { var d = new Date(t); return (d.getMonth() + 1) + '/' + d.getDate(); }
  function levelOf(points) {
    var level = 1, need = 100, remain = points || 0;
    while (remain >= need) { remain -= need; level++; need = 100 + (level - 1) * 70; }
    return { level: level, into: remain, need: need };
  }
  function fmtSize(n) {
    n = n || 0;
    if (n < 1024) return n + ' B';
    if (n < 1048576) return (n / 1024).toFixed(1) + ' KB';
    if (n < 1073741824) return (n / 1048576).toFixed(1) + ' MB';
    return (n / 1073741824).toFixed(2) + ' GB';
  }
  function emptyUser() {
    return { name: '学习者', createdAt: Date.now(), points: 0, dailyGoalMin: 30, goals: [], checkIns: {}, mastery: {}, logs: [], streak: 0, streakLast: '' };
  }

  /* ================= 数据模型 v4 =================
     folders[]    文件夹树（parentId=null 即顶层「项目」）
     materials[]  资料，folderId 归属
     questions[]  题目，folderId 归属，materialIds 关联资料
     lists[]      学习清单，items 引用资料/文件夹/计时/待办
     users.local  mastery 以题目 id 为键；logs 记 folderId/folderName
  */
  function sampleStore() {
    var now = Date.now();
    return {
      version: 4,
      folders: [
        { id: 'f_demo', name: '示例：公基速通', parentId: null, createdAt: now },
        { id: 'f_demo_pol', name: '政治常识', parentId: 'f_demo', createdAt: now },
        { id: 'f_demo_law', name: '法律常识', parentId: 'f_demo', createdAt: now }
      ],
      materials: [
        { id: 'm_demo1', kind: 'link', title: '中国大学MOOC（慕课）', folderId: 'f_demo', tags: ['公开课'], note: '找专业课系统课', url: 'https://www.icourse163.org/', status: 'new', fav: true, opens: 0, lastOpenAt: 0, createdAt: now }
      ],
      questions: [
        { id: 'q_demo1', folderId: 'f_demo_pol', type: 'single', stem: '我国的根本政治制度是？', options: [{ key: 'A', text: '人民代表大会制度' }, { key: 'B', text: '中国共产党领导的多党合作制度' }, { key: 'C', text: '民族区域自治制度' }, { key: 'D', text: '基层群众自治制度' }], answer: ['A'], analysis: '人民代表大会制度是我国的根本政治制度。', tags: ['政治'], materialIds: [], createdAt: now },
        { id: 'q_demo2', folderId: 'f_demo_law', type: 'judge', stem: '全国人民代表大会是最高国家权力机关。', options: [{ key: 'T', text: '正确' }, { key: 'F', text: '错误' }], answer: ['T'], analysis: '宪法规定全国人大是最高国家权力机关。', tags: ['法律'], materialIds: [], createdAt: now },
        { id: 'q_demo3', folderId: 'f_demo_law', type: 'multi', stem: '下列属于行政处罚的有？', options: [{ key: 'A', text: '警告' }, { key: 'B', text: '罚款' }, { key: 'C', text: '行政拘留' }, { key: 'D', text: '罚金' }], answer: ['A', 'B', 'C'], analysis: '罚金是刑罚（附加刑），不属于行政处罚。', tags: ['法律'], materialIds: [], createdAt: now }
      ],
      lists: [],
      users: { local: emptyUser() }
    };
  }
  function migrateV1toV2(o) {
    var out = { version: 2, projects: [], categories: o.categories || [], materials: [], questions: [], users: o.users || { local: emptyUser() } };
    (o.subjects || []).forEach(function (s) {
      out.projects.push({ id: s.id, name: s.name, desc: s.desc || '', createdAt: Date.now() });
      (s.chapters || []).forEach(function (c) {
        (c.questions || []).forEach(function (q) {
          var tags = (q.tags || []).slice();
          if (c.name && tags.indexOf(c.name) < 0) tags.push(c.name);
          out.questions.push({ id: q.id, projectId: s.id, type: q.type, stem: q.stem, options: q.options, answer: q.answer, analysis: q.analysis || '', cat: q.cat || '', tags: tags, materialIds: q.materialIds || [], createdAt: Date.now() });
        });
      });
    });
    (o.materials || []).forEach(function (m) {
      var tags = (m.tags || []).slice(), copy = {};
      for (var k in m) if (Object.prototype.hasOwnProperty.call(m, k)) copy[k] = m[k];
      copy.projectId = m.projectId || m.subjectId || '';
      copy.tags = tags;
      delete copy.subjectId; delete copy.chapterId;
      out.materials.push(copy);
    });
    (out.users.local.logs || []).forEach(function (l) {
      if (l.projectId === undefined) l.projectId = l.subjectId || '';
      if (l.projectName === undefined) l.projectName = l.subjectName || '';
    });
    return out;
  }
  function migrateV2toV4(o) {
    var now = Date.now();
    var out = { version: 4, folders: [], materials: [], questions: [], lists: o.lists || [], users: o.users || { local: emptyUser() } };
    (o.projects || []).forEach(function (p) { out.folders.push({ id: p.id, name: p.name, parentId: null, createdAt: p.createdAt || now }); });
    var catMap = {};
    function folderFor(pid, catId) {
      if (!catId) return pid || '';
      var key = (pid || '') + '::' + catId;
      if (catMap[key]) return catMap[key];
      var c = (o.categories || []).filter(function (x) { return x.id === catId; })[0];
      var fid = genId('f');
      out.folders.push({ id: fid, name: c ? c.name : '未分类', parentId: pid || null, createdAt: now });
      catMap[key] = fid;
      return fid;
    }
    (o.materials || []).forEach(function (m) {
      var copy = {};
      for (var k in m) if (Object.prototype.hasOwnProperty.call(m, k)) copy[k] = m[k];
      copy.folderId = folderFor(m.projectId || '', m.cat || '');
      delete copy.projectId; delete copy.cat;
      out.materials.push(copy);
    });
    (o.questions || []).forEach(function (q) {
      var copy = {};
      for (var k in q) if (Object.prototype.hasOwnProperty.call(q, k)) copy[k] = q[k];
      copy.folderId = folderFor(q.projectId || '', q.cat || '');
      delete copy.projectId; delete copy.cat;
      out.questions.push(copy);
    });
    (out.users.local.logs || []).forEach(function (l) {
      if (l.folderId === undefined) l.folderId = l.projectId || '';
      if (l.folderName === undefined) l.folderName = l.projectName || '';
    });
    return out;
  }
  var migratedFlag = false;
  function normalize(o) {
    if (!o || typeof o !== 'object') return sampleStore();
    if (o.subjects && !o.projects && !o.folders) { o = migrateV1toV2(o); migratedFlag = true; }
    if (o.projects && !o.folders) { o = migrateV2toV4(o); migratedFlag = true; }
    if (!o.folders) o.folders = [];
    if (!o.materials) o.materials = [];
    if (!o.questions) o.questions = [];
    if (!o.lists) o.lists = [];
    if (!o.users) o.users = {};
    if (!o.users.local) o.users.local = emptyUser();
    if (!o.users.local.mastery) o.users.local.mastery = {};
    if (!o.users.local.logs) o.users.local.logs = [];
    (o.lists || []).forEach(function (l) {
      (l.items || []).forEach(function (it) {
        if (it.due === undefined) it.due = '';
        if (it.repeat === undefined) it.repeat = '';
        if (!Array.isArray(it.days)) it.days = [];
        if (!it.doneMap) it.doneMap = {};
        if (!it.skipMap) it.skipMap = {};
        if (it.postponedCount === undefined) it.postponedCount = 0;
      });
    });
    return o;
  }

  /* ================= 存储 ================= */
  var persistOk = true;
  function loadStore() {
    try {
      var raw = localStorage.getItem(KEY);
      if (!raw) return sampleStore();
      return normalize(JSON.parse(raw));
    } catch (e) { persistOk = false; return sampleStore(); }
  }
  function saveStore() {
    if (!persistOk) return;
    try { store.appVersion = APP_VERSION; localStorage.setItem(KEY, JSON.stringify(store)); }
    catch (e) { persistOk = false; toast('⚠️ 浏览器本地存储不可用，数据无法保存'); }
  }
  var store = loadStore();
  var user = store.users.local;
  if (migratedFlag) { try { localStorage.setItem(KEY, JSON.stringify(store)); } catch (e) {} }

  /* ================= 树与查询 ================= */
  function folderById(id) { return store.folders.filter(function (f) { return f.id === id; })[0] || null; }
  function childFolders(id) { return store.folders.filter(function (f) { return (f.parentId || null) === (id || null); }); }
  function folderPath(id) {
    var path = [], guard = 0;
    while (id && guard++ < 50) { var f = folderById(id); if (!f) break; path.unshift(f); id = f.parentId; }
    return path;
  }
  function descendants(id) {
    var out = {}, queue = [id];
    while (queue.length) {
      var cur = queue.shift();
      if (out[cur]) continue;
      out[cur] = 1;
      childFolders(cur).forEach(function (c) { queue.push(c.id); });
    }
    return Object.keys(out);
  }
  function subtreeMaterials(id) { var d = descendants(id); return store.materials.filter(function (m) { return d.indexOf(m.folderId || '') >= 0; }); }
  function subtreeQuestions(id) { var d = descendants(id); return store.questions.filter(function (q) { return d.indexOf(q.folderId || '') >= 0; }); }
  function materialById(id) { return store.materials.filter(function (m) { return m.id === id; })[0] || null; }
  function questionById(id) { return store.questions.filter(function (q) { return q.id === id; })[0] || null; }
  function listById(id) { return store.lists.filter(function (l) { return l.id === id; })[0] || null; }
  function linkedQuestions(mid) { return store.questions.filter(function (q) { return (q.materialIds || []).indexOf(mid) >= 0; }); }
  function allTags(list) {
    var s = {}, out = [];
    list.forEach(function (x) { (x.tags || []).forEach(function (t) { if (!s[t]) { s[t] = 1; out.push(t); } }); });
    return out;
  }
  function folderStats(id) {
    var qs = subtreeQuestions(id), ms = subtreeMaterials(id);
    var wrong = 0, mastered = 0, attempts = 0;
    qs.forEach(function (q) {
      var st = masteryState(user.mastery[q.id]);
      attempts += st.a;
      if (st.wrong) wrong++;
      if (st.mastered) mastered++;
    });
    var sec = user.logs.filter(function (l) { return (l.folderId || '') === id; }).reduce(function (a, l) { return a + (l.seconds || 0); }, 0);
    return {
      qCount: qs.length, mCount: ms.length, wrong: wrong, mastered: mastered, attempts: attempts, seconds: sec,
      mDone: ms.filter(function (m) { return m.status === 'done'; }).length,
      subs: childFolders(id).length
    };
  }
  function listProgress(l) {
    var items = l.items || [], done = items.filter(function (i) { return i.done; }).length;
    return { done: done, total: items.length, pct: items.length ? Math.round((done / items.length) * 100) : 0 };
  }
  function listToday(l) {
    var tk = todayKey();
    var due = (l.items || []).filter(function (i) { return isDueToday(i, tk) && !isSkippedToday(i, tk); });
    var done = due.filter(function (i) { return isDoneToday(i, tk); }).length;
    var overdue = due.filter(function (i) { return isOverdue(i, tk); }).length;
    return { due: due.length, done: done, overdue: overdue, pct: due.length ? Math.round((done / due.length) * 100) : 0, total: (l.items || []).length };
  }
  function todayTasks() {
    var tk = todayKey(), out = [];
    store.lists.forEach(function (l) {
      (l.items || []).forEach(function (it) {
        if (!isDueToday(it, tk)) return;
        if (isSkippedToday(it, tk)) return;
        out.push({ list: l, item: it, overdue: isOverdue(it, tk), done: isDoneToday(it, tk) });
      });
    });
    out.sort(function (a, b) {
      if (a.done !== b.done) return a.done ? 1 : -1;
      if (a.overdue !== b.overdue) return a.overdue ? -1 : 1;
      return 0;
    });
    return out;
  }
  function itemTitle(it) {
    if (it.kind === 'material') { var m = materialById(it.refId); return m ? m.title : '（资料已删除）'; }
    if (it.kind === 'quiz' || it.kind === 'review') { var f = folderById(it.refId); return (it.kind === 'review' ? '错题回顾：' : '测验：') + (f ? f.name : '（文件夹已删除）'); }

        tx.onerror = function () { reject(tx.error); };

    });

    });
  }

  function onLibImportFile(input) {

    var r = new FileReader();
    r.onload = function () {
      var obj;

      if (!obj || obj.type !== 'learnhub-library' || !Array.isArray(obj.materials)) { toast('❌ 不是资料库备份文件'); return; }
      var fMap = {};

        if (!fd || !fd.name) return;

        if (hit) { fMap[fd.id] = hit.id; return; }
        var nf = { id: genId('f'), name: fd.name, parentId: null, createdAt: Date.now() };
        store.folders.push(nf); fMap[fd.id] = nf.id;
      });
      var added = 0, pending = 0;

        if (!m || !m.kind) return;

        for (var k in m) if (Object.prototype.hasOwnProperty.call(m, k) && k !== 'file') copy[k] = m[k];
        copy.id = id;
        copy.folderId = fMap[m.folderId] || m.folderId || '';
        if (copy.folderId && !folderById(copy.folderId)) copy.folderId = '';
        copy.opens = copy.opens || 0;
        copy.lastOpenAt = copy.lastOpenAt || 0;
        copy.createdAt = copy.createdAt || Date.now();
        if (copy.kind === 'file') {
          if (!m.file || !m.file.base64) return;
          copy.fileName = m.file.name || copy.fileName || 'file';
          copy.mime = m.file.mime || copy.mime || '';
          var blob = base64ToBlob(m.file.base64, copy.mime);
          copy.size = blob.size;
          store.materials.push(copy);
          pending++;
          filePut(id, blob, copy.fileName).then(function () {
            pending--;
            if (pending === 0) { saveStore(); render(); toast('已导入 ' + added + ' 份资料'); }
          }).catch(function () { pending--; if (pending === 0) { saveStore(); render(); toast('部分文件保存失败'); } });
        } else {
          store.materials.push(copy);
        }
        added++;
      });
      saveStore();
      if (pending === 0) { render(); toast('已导入 ' + added + ' 份资料'); }
    };
    r.readAsText(f);
    input.value = '';
  }

  };
  ACT.timerPreset = function (m) {

  };
  ACT.timerCustom = function () {
    var t = ui.timer;

    render();

  ACT.timerStart = function () {

  ACT.timerPause = function () { if (ui.timer.status === 'running') { ui.timer.status = 'paused'; stopTick(); render(); } };

  ACT.timerReset = function () { stopTick(); ui.timer = newTimer(); render(); };
  ACT.timerFinish = function () {
    var t = ui.timer;
    var sec = t.mode === 'stop' ? t.elapsed : Math.max(0, t.cdSec - t.remain);
    stopTick();
    if (sec < 1) { t.status = 'idle'; toast('时长不足，未记录'); render(); return; }
    var f = t.folderId ? folderById(t.folderId) : null;
    var e = touchToday(user);
    e.sec += sec; e.sessions += 1;
    bumpStreak(user);
    user.logs.push({ id: genId('log'), at: Date.now(), date: dateKey(new Date()), folderId: f ? f.id : '', folderName: f ? f.name : '自由学习', mode: t.mode === 'cd' ? 'countdown' : 'timer', seconds: sec, correct: 0, total: 0, rating: 0, tags: [], comment: (t.note || '').trim() });
    saveStore();
    var label = fmtLong(sec);

  function onClick(e) {
    var el = e.target.closest ? e.target.closest('[data-act]') : null;

      if (act === 'libToggleQ') { ACT.libToggleQ(arg); return; }
      if (act === 'itemToggle') { ACT.itemToggle(arg); return; }
      return;
    }
    if (el.tagName === 'SELECT') return;
    if (!ACT[act]) return;
    if (act === 'startQuiz') { var p = String(arg).split('|'); ACT.startQuiz(p[0], p[1]); return; }
    if (act === 'itemMove') { ACT.itemMove(arg); return; }
    if (act === 'timerPreset' || act === 'statsDays' || act === 'qRate') { ACT[act](Number(arg)); return; }
    if (arg === null || arg === undefined) { ACT[act](); return; }

    document.addEventListener('dragend', function (e) {
      clearOver();
      var el = e.target.closest ? e.target.closest('[data-drag]') : null;
      if (el && el.classList) el.classList.remove('dragging');
      if (ui.drag) { ui.drag = null; hideDropBar(); }
    });
    var imp = document.createElement('input');
    imp.type = 'file'; imp.accept = '.json,application/json'; imp.id = 'import-file'; imp.style.display = 'none';
    document.body.appendChild(imp);
    var imp2 = document.createElement('input');
    imp2.type = 'file'; imp2.accept = '.json,application/json'; imp2.id = 'lib-import'; imp2.style.display = 'none';
    document.body.appendChild(imp2);
    render();
  }
  ACT.listAddItemHere = function (fid) {
    var f = folderById(fid);
    var name = prompt('新建清单名称', f ? (f.name + ' 学习流程') : '新清单');
    if (!name) return;
    var l = { id: genId('l'), name: name.trim(), folderId: fid, createdAt: Date.now(), items: [] };
    store.lists.push(l); saveStore();
    ui.page = 'list'; ui.listId = l.id; ui.itemForm = null;
    render(); toast('清单已创建，添加任务吧');
  };
  try { if (typeof window !== 'undefined') window.__learnhub = { ui: ui, render: render, ACT: ACT, get store() { return store; } }; } catch (e) {}
  if (typeof document !== 'undefined' && typeof localStorage !== 'undefined') {
    if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
    else boot();
  }
})();
</script>
